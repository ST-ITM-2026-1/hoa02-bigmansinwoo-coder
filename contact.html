<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact | Kim Sinwoo</title>
</head>
<body>
    <header>
        <nav>
            <span class="nav-logo">KSW</span>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="project.html">Projects</a>
                <a href="skill.html">Skills</a>
                <a href="contact.html" class="active">Contact</a>
                <a href="github.html">GitHub</a>
            </div>
            <button id="theme-toggle">Dark Mode</button>
        </nav>
    </header>
    
    <main>
        <section id="contact">
            <p class="section-tag">Say Hello</p>
            <h1>Contact</h1>
            <p class="section-subtitle">Feel free to reach out to me</p>
 
            <div class="contact-wrapper">
                <form>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="First-Name">First Name</label>
                            <input type="text" id="First-Name" name="First-Name" placeholder="John">
                        </div>
                        <div class="form-group">
                            <label for="Last-Name">Last Name</label>
                            <input type="text" id="Last-Name" name="Last-Name" placeholder="Doe">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="Email">Email</label>
                        <input type="email" id="Email" name="Email" placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label for="Message">Message</label>
                        <textarea id="Message" name="Message" rows="5" placeholder="Write your message here..."></textarea>
                    </div>
                    <input type="submit" value="Send Message">
                </form>
 
                <div class="contact-info">
                    <div class="info-card">
                        <h3>Location</h3>
                        <p>Seoul, South Korea</p>
                    </div>
                    <div class="info-card">
                        <h3>University</h3>
                        <p>Seoul National University of Science and Technology</p>
                    </div>
                    <div class="info-card">
                        <h3>Department</h3>
                        <p>Information Technology Management</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Kim Sinwoo. All rights reserved.</p>
    </footer>
    <script src ="script.js"></script>

</body>
</html>
